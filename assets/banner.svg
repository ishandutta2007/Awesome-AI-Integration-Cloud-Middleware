<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseBeam {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
      50% { stroke-dashoffset: 40; opacity: 0.8; }
    }
    @keyframes subtleGlow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 30px rgba(192, 132, 252, 0.7)); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: center; }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite 0.5s; }
    .pill-3 { animation: floatPill3 4.5s ease-in-out infinite 1s; }
    .beam { stroke-dasharray: 8, 8; animation: pulseBeam 3s linear infinite; }
    .title-glow { animation: subtleGlow 6s ease-in-out infinite; }

    .brand-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .tagline-badge {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200"/>
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420"/>
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="140" r="140" fill="#38bdf8" opacity="0.35" filter="url(#orbGlow)"/>
  <circle class="orb-2" cx="960" cy="240" r="160" fill="#818cf8" opacity="0.35" filter="url(#orbGlow)"/>
  <circle class="orb-1" cx="620" cy="350" r="130" fill="#c084fc" opacity="0.25" filter="url(#orbGlow)"/>

  <!-- Floating Dynamic Connecting Data Beams (Background / Accent) -->
  <g class="beam" stroke="#818cf8" stroke-width="2" fill="none">
    <path d="M 150,335 C 320,380 500,320 680,350"/>
    <path d="M 720,345 C 850,370 1000,330 1100,350"/>
    <path d="M 280,70 C 450,40 750,50 920,80"/>
  </g>

  <!-- Dynamic Interactive Floating Feature Pills (Positioned harmoniously around canvas) -->
  <g class="pill-1">
    <!-- Pill 1: Gateways -->
    <rect x="70" y="318" width="190" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="92" cy="337" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <text x="108" y="342" class="pill-text">⚡ AI API Gateways</text>
  </g>

  <g class="pill-2">
    <!-- Pill 2: Model Serving -->
    <rect x="280" y="328" width="215" height="38" rx="19" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="302" cy="347" r="5" fill="#818cf8" filter="url(#glow)"/>
    <text x="318" y="352" class="pill-text">🚀 Serverless GPU Serving</text>
  </g>

  <g class="pill-3">
    <!-- Pill 3: MCP & Agent Protocol -->
    <rect x="515" y="320" width="195" height="38" rx="19" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="537" cy="339" r="5" fill="#c084fc" filter="url(#glow)"/>
    <text x="553" y="344" class="pill-text">🔌 MCP Protocol Bridges</text>
  </g>

  <g class="pill-1">
    <!-- Pill 4: Orchestration -->
    <rect x="730" y="330" width="195" height="38" rx="19" fill="url(#cardGrad)" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="752" cy="349" r="5" fill="#2dd4bf" filter="url(#glow)"/>
    <text x="768" y="354" class="pill-text">🧠 Agent Orchestration</text>
  </g>

  <g class="pill-2">
    <!-- Pill 5: Cloud Middleware -->
    <rect x="945" y="318" width="185" height="38" rx="19" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="967" cy="337" r="5" fill="#f472b6" filter="url(#glow)"/>
    <text x="983" y="342" class="pill-text">☁️ Cloud Middleware</text>
  </g>

  <!-- FOREGROUND: Category Tag Badge -->
  <g transform="translate(600, 105)">
    <rect x="-180" y="-17" width="360" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" class="tagline-badge">ENTERPRISE CLOUD INFRASTRUCTURE &amp; LLMOPS</text>
  </g>

  <!-- FOREGROUND: Main Repository Title (Ensured crystal clear & unobstructed) -->
  <g class="title-glow" transform="translate(600, 175)">
    <text x="0" y="0" text-anchor="middle" class="brand-title" fill="url(#primaryGrad)">
      Awesome AI Integration &amp; Cloud Middleware
    </text>
  </g>

  <!-- FOREGROUND: Subtitle & Descriptor -->
  <text x="600" y="222" text-anchor="middle" class="brand-subtitle">
    Curated Hub of Production AI Gateways, GPU Serving Engines, MCP Bridges &amp; Agent Infrastructure
  </text>
  <text x="600" y="254" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" font-weight="500">
    LiteLLM • vLLM • Modal • Together AI • LangChain • Ollama • Fireworks AI • MCP • Portkey • Dify
  </text>

  <!-- Decorative Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
</svg>
